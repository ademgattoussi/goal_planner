  <nav class="sidebar">
    <span class="logo mb-4">TASKMASTER PRO</span>
    <ul class="nav flex-column">
      <li>
        <a routerLink="home" routerLinkActive="active" class="nav-link">
          <i class="bi bi-house-door-fill"></i>
          Home
        </a>
      </li>
      <li>
        <a routerLink="goal-list" routerLinkActive="active" class="nav-link">
          <i class="bi bi-bullseye"></i>
          Goals
        </a>
      </li>
      <li>
        <a routerLink="task-list" routerLinkActive="active" class="nav-link">

        </a>
      </li>
      <li>
        <a (click)="authService.logout()" class="nav-link text-danger">

        </a>

  <main class="main-content">
    <router-outlet></router-outlet>
