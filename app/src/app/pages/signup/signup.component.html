<div class="signup-container dark-theme">
  <mat-card class="signup-card">
    <mat-card-header class="card-header">
      <mat-card-title>Create Account</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="signup-form pt-5">
        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Full Name</mat-label>
          <input matInput formControlName="fullname">
          <mat-error *ngIf="signupForm.get('fullname')?.hasError('required')">
            Full name is required
          </mat-error>
          <mat-error *ngIf="signupForm.get('fullname')?.hasError('minlength')">
            Minimum 3 characters
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email">
          <mat-error *ngIf="signupForm.get('email')?.hasError('required')">
            Email is required
          </mat-error>
          <mat-error *ngIf="signupForm.get('email')?.hasError('email')">
            Please enter a valid email
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password">
          <mat-error *ngIf="signupForm.get('password')?.hasError('required')">
            Password is required
          </mat-error>
          <mat-error *ngIf="signupForm.get('password')?.hasError('minlength')">
            Minimum 6 characters
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Mobile</mat-label>
          <input matInput formControlName="mobile" type="tel">
          <mat-error *ngIf="signupForm.get('mobile')?.hasError('required')">
            Mobile number is required
          </mat-error>
          <mat-error *ngIf="signupForm.get('mobile')?.hasError('pattern')">
            Please enter a valid mobile number
          </mat-error>
        </mat-form-field>

        <mat-card-actions class="form-actions">
          <button mat-raised-button 
                  color="primary" 
                  type="submit" 
                  class="signup-btn"
                  [disabled]="!signupForm.valid">
            Sign Up
          </button>
          <button mat-button 
                  type="button" 
                  class="login-link"
                  routerLink="/login">
            Already have an account? Login
          </button>
        </mat-card-actions>
      </form>
    </mat-card-content>
  </mat-card>
</div>
